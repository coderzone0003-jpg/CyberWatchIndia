# Render deployment — Cyber Crime Portal backend
# Developers: Shubham Bhojane, Vinanti Bendure, Darshan Seleke, Chaitrali Karale
services:
  - type: web
    name: cyberwatchindia-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://cyber-watch-india-gilt.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://cyber-watch-india-gilt.vercel.app,https://cyber-watch-india.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: FROM_NAME
        value: Cyber Crime Portal
